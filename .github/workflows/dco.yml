name: DCO

# Every commit in a pull request needs a "Signed-off-by:" line (git commit -s).
# See CONTRIBUTING.md.
on:
  pull_request:

permissions:
  contents: read

jobs:
  signoff:
    name: Commits are signed off
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check Signed-off-by
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$sha" | grep -qiE '^Signed-off-by: .+ <.+>'; then
              echo "::error::Commit $(git log -1 --format='%h %s' "$sha") has no Signed-off-by line."
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            echo "Fix with: git rebase --signoff $BASE && git push --force-with-lease"
            exit 1
          fi
          echo "All commits are signed off."
