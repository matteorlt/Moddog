name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Versions in sync
        run: node scripts/check-version.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Lint & format
        run: npx biome ci .
      - name: Tests
        run: npm test
      - name: Build (Chrome/Opera + Firefox)
        run: npm run build
      - name: Lint Firefox build (web-ext)
        run: npm run lint:firefox
      - name: Package
        run: npm run package
      - name: Upload test build
        uses: actions/upload-artifact@v7
        with:
          name: moddog-extensions-${{ github.sha }}
          path: moddog-*.zip
          retention-days: 14
