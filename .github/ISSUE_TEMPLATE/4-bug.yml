name: Bug report
description: Something doesn't work.
labels: [bug, needs-triage]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open https://github.com/…
        2. Click the Moddog badge
        3. …
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser, Moddog version, AI provider
      placeholder: Chrome 140, Moddog 0.1.0, Anthropic
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Errors
      description: From chrome://extensions → Moddog → Errors, or the service worker console.
      render: text
